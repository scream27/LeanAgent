name: Harness CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'tests/test_harness.py'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'tests/test_harness.py'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Harness tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Test the harness without Lean or model API calls
        run: python -m unittest discover -s tests -p 'test_harness.py' -v
