name: Dashboard CI and Production

on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Test and build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test scoring and input validation
        run: npm test
      - name: Check published data
        run: npm run data:check
      - name: Build
        run: npm run build
      - name: Save the tested site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-${{ github.sha }}
          path: dashboard/dist/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  deploy:
    name: Deploy production dashboard
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download the tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-${{ github.sha }}
          path: dashboard/dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT DASHBOARD_URL CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure $key in the repository Actions settings (see dashboard/README.md)."
              exit 1
            fi
          done
          npm exec --yes --package=wrangler@4.152.0 -- wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify production serves the tested snapshots
        run: npm run deploy:check
