[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-agent-arena"
version = "0.1.0"
description = "A minimal, replayable Lean proof-refactoring harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lean-agent = "lean_agent.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean_agent = ["provenance.json", "evaluator/provenance.json"]
